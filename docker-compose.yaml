networks:
  endfield-network:

services:
  backend:
    depends_on:
      - postgres
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: endfield
      DB_PASSWORD: endfield
      DB_NAME: endfield
    image: 'endfield-industries-amikom/endfield-backend:0.0.1'
    networks:
      - endfield-network
    ports:
      - 8080:3000

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@endfield.com
      PGADMIN_DEFAULT_PASSWORD: endfield
      POSTGRES_HOST: postgres
      POSTGRES_USER: endfield
      POSTGRES_PASSWORD: endfield
      POSTGRES_DB: endfield
      PGADMIN_CONFIG_SERVER_MODE: False
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: False
    ports:
      - 5050:80
    networks:
      - endfield-network

  postgres:
    environment:
      POSTGRES_USER: endfield
      POSTGRES_PASSWORD: endfield
      POSTGRES_DB: endfield
    image: docker.io/library/postgres:17
    networks:
      - endfield-network
    volumes:
      - ./db-data:/var/lib/postgresql/data:Z
